<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cổng Tra Cứu Kết Quả Siêu Âm - Phòng Khám BS.CKII Nguyễn Văn Hùng</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root { --primary: #008080; --primary-dark: #005f5f; --primary-light: #e6f7f7; --text-main: #1e293b; --bg-light: #f1f5f9; --white: #ffffff; --radius: 14px; --shadow: 0 4px 20px rgba(0,0,0,0.08); }
- { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; background-color: var(--bg-light); color: var(--text-main); padding: 12px; }
.container { max-width: 600px; margin: 10px auto; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); border-top: 6px solid var(--primary); overflow: hidden; padding: 24px 18px; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { color: var(--primary-dark); font-size: 1.4rem; font-weight: 800; text-transform: uppercase; }
.header p { font-size: 1rem; color: #64748b; font-weight: 600; }
.auth-card { background: var(--primary-light); border: 2px solid #b2dfdb; border-radius: 12px; padding: 18px; margin-bottom: 20px; }
.input-group { margin-bottom: 14px; text-align: left; }
.input-group label { display: block; font-size: 0.95rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }
.input-group input { width: 100%; padding: 14px 16px; font-size: 1.15rem; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; font-weight: 600; background: white; }
.input-group input:focus { border-color: var(--primary); }
.btn-submit { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1.15rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 12px rgba(0,128,128,0.25); }
#result-area { display: none; margin-top: 20px; }
.patient-card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 20px; text-align: left; }
.p-name { font-size: 1.35rem; font-weight: 800; color: #b71c1c; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 12px; }
.p-info { font-size: 1.05rem; margin-bottom: 8px; color: #334155; }
.conclusion-box { background: #fef2f2; border-left: 5px solid #ef4444; padding: 14px; border-radius: 0 8px 8px 0; margin-top: 14px; }
.conclusion-title { font-weight: 800; color: #b91c1c; font-size: 1.05rem; }
.conclusion-text { font-size: 1.15rem; font-weight: 700; color: #1e293b; margin-top: 4px; }
.image-gallery { margin-top: 20px; text-align: left; }
.gallery-title { font-size: 1.2rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 12px; }
.img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
.img-item { background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.15); text-align: center; }
.img-item img { width: 100%; height: auto; display: block; }
.btn-download { display: block; padding: 10px; background: #334155; color: white; text-decoration: none; font-weight: 700; font-size: 0.95rem; }
.error-msg { color: #dc2626; font-size: 1.05rem; font-weight: 700; margin-top: 12px; display: none; background: #fee2e2; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Phòng Khám Phụ Sản</h1>
<p>BS.CKII NGUYỄN VĂN HÙNG</p>
</div>
<div class="auth-card">
<div class="input-group">
<label><i class="fa-solid fa-qrcode"></i> Mã Hồ Sơ Bệnh Nhân:</label>
<input type="text" id="inp-ma" placeholder="Ví dụ: 261031-185842">
</div>
<div class="input-group">
<label><i class="fa-solid fa-phone"></i> Số Điện Thoại Đăng Ký (Mật khẩu):</label>
<input type="tel" id="inp-sdt" placeholder="Nhập số điện thoại bệnh nhân...">
</div>
<button type="button" class="btn-submit" onclick="xacThucXemKetQua()">
<i class="fa-solid fa-lock-open"></i> XÁC THỰC & XEM KẾT QUẢ
</button>
<div class="error-msg" id="error-box"></div>
</div>
<div id="result-area">
<div class="patient-card">
<div class="p-name" id="res-name">HỌ VÀ TÊN</div>
<div class="p-info"><strong>Mã số:</strong> <span id="res-id"></span> | <strong>Ngày khám:</strong> <span id="res-date"></span></div>
<div class="p-info"><strong>Tuổi/Năm sinh:</strong> <span id="res-age"></span> | <strong>Giới tính:</strong> <span id="res-gender"></span></div>
<div class="p-info"><strong>Chẩn đoán:</strong> <span id="res-diag"></span></div>
<div class="conclusion-box">
<div class="conclusion-title">KẾT LUẬN SIÊU ÂM:</div>
<div class="conclusion-text" id="res-conclusion"></div>
</div>
<div class="p-info" style="margin-top: 12px; color: #004d40;">
<strong>Lời dặn & Hẹn tái khám:</strong> <span id="res-recom"></span>
</div>
</div>
<div class="image-gallery">
<div class="gallery-title"><i class="fa-solid fa-images"></i> HÌNH ẢNH SIÊU ÂM MÀU / 4D / 5D:</div>
<div class="img-grid" id="gallery-grid"></div>
</div>
</div>
</div>
<script>
const SERVER_URL = "https://server.bacsyvanhung.com";
const urlParams = new URLSearchParams(window.location.search);
const maParam = urlParams.get('ma') || urlParams.get('id') || '';
if (maParam) {
document.getElementById('inp-ma').value = maParam;
}
async function xacThucXemKetQua() {
const ma = document.getElementById('inp-ma').value.trim();
const sdt = document.getElementById('inp-sdt').value.trim();
const errBox = document.getElementById('error-box');
const resArea = document.getElementById('result-area');
if (!ma) {
errBox.style.display = 'block';
errBox.innerText = 'Vui lòng nhập Mã hồ sơ bệnh nhân!';
return;
}
errBox.style.display = 'block';
errBox.style.background = '#e0f2fe';
errBox.style.color = '#0369a1';
errBox.innerText = 'Đang tải kết quả từ máy chủ phòng khám...';
try {
const response = await fetch(SERVER_URL + '/api/tra-cuu?ma=' + encodeURIComponent(ma) + '&sdt=' + encodeURIComponent(sdt));
const data = await response.json();
if (data.status === 'success') {
errBox.style.display = 'none';
const p = data.patient || data.data;
document.getElementById('res-name').innerText = p.fullname || 'BỆNH NHÂN';
document.getElementById('res-id').innerText = p.id || ma;
document.getElementById('res-date').innerText = p.exam_date || '';
document.getElementById('res-age').innerText = p.age || '--';
document.getElementById('res-gender').innerText = p.gender || 'Nữ';
document.getElementById('res-diag').innerText = p.diagnosis || '';
document.getElementById('res-conclusion').innerText = p.conclusion || 'Bình thường';
document.getElementById('res-recom').innerText = p.recommendation || 'Theo dõi định kỳ';
const grid = document.getElementById('gallery-grid');
grid.innerHTML = '';
const imgs = data.images || p.images || [];
if (imgs.length > 0) {
imgs.forEach(function(imgUri, idx) {
const imgUrl = imgUri.startsWith('http') ? imgUri : (SERVER_URL + imgUri);
const item = document.createElement('div');
item.className = 'img-item';
item.innerHTML = '<a href="' + imgUrl + '" target="_blank"><img src="' + imgUrl + '" alt="Ảnh siêu âm ' + (idx + 1) + '"></a><a href="' + imgUrl + '" download class="btn-download"><i class="fa-solid fa-download"></i> Tải ảnh ' + (idx + 1) + ' về máy</a>';
grid.appendChild(item);
});
} else {
grid.innerHTML = '<p style="color: #64748b; font-style: italic;">(Ca khám này không lưu kèm file ảnh siêu âm trên hệ thống).</p>';
}
resArea.style.display = 'block';
} else {
errBox.style.background = '#fee2e2';
errBox.style.color = '#dc2626';
errBox.innerText = data.message || 'Không tìm thấy hồ sơ hoặc SĐT chưa khớp!';
resArea.style.display = 'none';
}
} catch (err) {
errBox.style.background = '#fee2e2';
errBox.style.color = '#dc2626';
errBox.innerText = 'Không thể kết nối đến máy chủ phòng khám. Vui lòng kiểm tra lại mạng!';
}
}
</script>
</body>
</html>
